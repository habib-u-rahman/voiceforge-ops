name: Keep Render backend awake

# Render's free tier spins the backend down after ~15 minutes of inactivity,
# causing a ~50s cold start on the next request. Pinging every 10 minutes
# keeps it perpetually warm at no cost.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          curl -sf -m 20 https://voiceforge-ops-backend.onrender.com/ \
            && echo "Backend responded OK" \
            || echo "Backend did not respond (may be a cold start in progress)"
