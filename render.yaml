services:
  # FastAPI backend — Whisper transcription, multi-agent parsing, dispatch.
  - type: web
    name: voiceforge-ops-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      # Set these in the Render dashboard after the first deploy —
      # marked sync:false so Render prompts for them instead of reading
      # (nonexistent) values from this file. Nothing secret lives in git.
      - key: GROQ_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: MAKE_WEBHOOK_URL
        sync: false
      # Comma-separated list of allowed frontend origins. Update this to
      # the frontend service's URL below once it's known (or leave as "*").
      - key: ALLOWED_ORIGINS
        value: "*"

  # Vite/React static frontend.
  - type: web
    name: voiceforge-ops-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Set to the backend service's public URL after the first deploy,
      # e.g. https://voiceforge-ops-backend.onrender.com
      - key: VITE_API_BASE
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
